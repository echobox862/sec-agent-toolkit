[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sec-tools-mcp"
version = "1.0.0"
description = "把端口扫描、字典生成、表单解析、tamper 语义验证接进 AI 客户端"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "echobox862" }]
keywords = ["security", "mcp", "recon", "pentest"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sec-tools-mcp = "sec_tools_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
