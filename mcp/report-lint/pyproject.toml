[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "report-lint"
version = "1.0.0"
description = "渗透测试报告交付前自检：结构、编号、脱敏、声明一致性"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "echobox862" }]
keywords = ["security", "pentest", "report", "mcp", "lint"]
dependencies = ["python-docx>=1.1"]

[project.optional-dependencies]
pdf = ["pymupdf>=1.24"]
dev = ["pytest>=8"]

[project.scripts]
report-lint = "report_lint.cli:main"
report-lint-mcp = "report_lint.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
